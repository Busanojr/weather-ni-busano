<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#04080f;--surface:#080f1c;--surface2:#0d1828;
      --border:rgba(56,189,248,.1);--border2:rgba(56,189,248,.28);
      --accent:#38bdf8;--accent2:#818cf8;
      --heat:#fb923c;--heat2:#ff4500;--heat3:#ffcc00;
      --green:#4ade80;--rain:#60a5fa;
      --muted:#475569;--text:#e2e8f0;--text-dim:#64748b;
      --font-mono:'Space Mono',monospace;--font-head:'Syne',sans-serif;
    }
    html{scroll-behavior:smooth}
    body{
      background:var(--bg);color:var(--text);font-family:var(--font-mono);
      min-height:100vh;padding:24px 20px 48px;max-width:1000px;margin:0 auto;
      position:relative;overflow-x:hidden;
    }

    /* Scanlines overlay */
    body::before{
      content:'';position:fixed;inset:0;
      background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,rgba(0,0,0,.08) 3px,rgba(0,0,0,.08) 4px);
      pointer-events:none;z-index:9999;
    }
    /* Radial glow bg */
    body::after{
      content:'';position:fixed;inset:0;
      background:radial-gradient(ellipse 60% 40% at 30% 20%, rgba(56,189,248,.04) 0%, transparent 70%),
                 radial-gradient(ellipse 50% 50% at 80% 80%, rgba(251,146,60,.03) 0%, transparent 60%);
      pointer-events:none;z-index:0;
    }
    .page-content{position:relative;z-index:1}

    /* ── HEADER ─────────────────────────── */
    .header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:12px;flex-wrap:wrap}
    .header-left h1{
      font-family:var(--font-head);font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;
      letter-spacing:-.02em;line-height:1;margin-bottom:4px;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .header-left p{font-size:.72rem;color:var(--text-dim);letter-spacing:.06em}
    .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
    .live-badge{
      display:flex;align-items:center;gap:6px;font-size:.68rem;letter-spacing:.1em;
      color:var(--green);border:1px solid rgba(74,222,128,.22);padding:4px 12px;border-radius:20px;
      background:rgba(74,222,128,.05);
    }
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.6s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1;box-shadow:0 0 4px var(--green)}50%{opacity:.3;box-shadow:none}}
    #last-updated{font-size:.62rem;color:var(--text-dim)}

    /* ── METRIC CARDS ───────────────────── */
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:13px;margin-bottom:20px}

    .card{
      background:var(--surface);border:1px solid var(--border);border-radius:14px;
      padding:16px 15px 14px;position:relative;overflow:hidden;
      transition:border-color .25s, transform .2s, box-shadow .25s;
      cursor:default;
    }
    .card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--card-accent,var(--accent));opacity:.75}
    .card-icon{font-size:.65rem;margin-bottom:10px;color:var(--text-dim);letter-spacing:.07em}
    .card-value{
      font-family:var(--font-head);font-size:2.1rem;font-weight:800;line-height:1;
      color:var(--card-accent,var(--accent));margin-bottom:6px;position:relative;z-index:2;
    }
    .card-unit{font-size:.6rem;color:var(--text-dim);letter-spacing:.08em;position:relative;z-index:2}
    .c-temp{--card-accent:var(--heat)}.c-hum{--card-accent:var(--accent)}
    .c-uv{--card-accent:var(--accent2)}.c-wind{--card-accent:var(--green)}
    .c-rain{--card-accent:var(--rain)}.c-ok{--card-accent:var(--green)}.c-err{--card-accent:#f87171}

    /* ── HEAT ANIMATION ─────────────────── */
    .flame-container{
      position:absolute;bottom:0;left:0;right:0;height:55px;
      display:flex;align-items:flex-end;justify-content:center;gap:3px;
      padding-bottom:0;pointer-events:none;overflow:hidden;opacity:0;
      transition:opacity .5s;
    }
    .c-temp .flame-container{opacity:1}
    .flame{
      border-radius:50% 50% 30% 30%;
      transform-origin:bottom center;
      animation:flicker 0.7s ease-in-out infinite alternate;
    }
    .flame:nth-child(1){width:12px;height:26px;background:linear-gradient(to top,#ff2200,#ff7700);animation-delay:0s}
    .flame:nth-child(2){width:14px;height:40px;background:linear-gradient(to top,#ff3300,#ffaa00);animation-delay:.12s}
    .flame:nth-child(3){width:16px;height:50px;background:linear-gradient(to top,#ff2200,#ffdd00);animation-delay:.04s}
    .flame:nth-child(4){width:14px;height:36px;background:linear-gradient(to top,#ff3300,#ffaa00);animation-delay:.18s}
    .flame:nth-child(5){width:11px;height:22px;background:linear-gradient(to top,#ff2200,#ff7700);animation-delay:.08s}
    @keyframes flicker{
      0%{transform:scaleX(.82) scaleY(.96) rotate(-3deg);filter:brightness(.9)}
      100%{transform:scaleX(1.18) scaleY(1.04) rotate(3deg);filter:brightness(1.1)}
    }
    /* heat glow */
    .c-temp{box-shadow:0 0 0 1px rgba(251,100,30,.0)}
    .c-temp:hover{box-shadow:0 0 20px rgba(251,100,30,.25),0 8px 30px rgba(0,0,0,.35)}
    .heat-glow{
      position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);
      width:80px;height:80px;border-radius:50%;
      background:radial-gradient(circle, rgba(255,80,0,.35) 0%, transparent 70%);
      animation:heat-pulse 1.5s ease-in-out infinite;pointer-events:none;
    }
    @keyframes heat-pulse{0%,100%{opacity:.6;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.2)}}

    /* ── HUMIDITY DROPS ─────────────────── */
    .drop-container{
      position:absolute;inset:0;pointer-events:none;overflow:hidden;
      opacity:0;transition:opacity .5s;border-radius:14px;
    }
    .c-hum .drop-container{opacity:1}
    .drop{
      position:absolute;width:2px;border-radius:0 0 50% 50%;
      background:linear-gradient(to bottom,transparent,rgba(96,165,250,.75));
      animation:fall linear infinite;
    }
    @keyframes fall{
      0%{top:-10%;opacity:0}10%{opacity:1}90%{opacity:.7}100%{top:105%;opacity:0}
    }

    /* ── WIND LINES ─────────────────────── */
    .wind-container{
      position:absolute;inset:0;pointer-events:none;overflow:hidden;
      opacity:0;transition:opacity .5s;border-radius:14px;
    }
    .c-wind .wind-container{opacity:1}
    .wline{
      position:absolute;height:1.5px;border-radius:2px;
      background:linear-gradient(to right,transparent,rgba(74,222,128,.65),transparent);
      animation:blow linear infinite;
    }
    @keyframes blow{
      0%{left:-40%;opacity:0}15%{opacity:1}85%{opacity:.8}100%{left:120%;opacity:0}
    }

    /* ── UV SPIN ────────────────────────── */
    .uv-orbit{
      position:absolute;right:12px;top:50%;transform:translateY(-50%);
      width:54px;height:54px;pointer-events:none;
      opacity:0;transition:opacity .4s;
    }
    .c-uv .uv-orbit{opacity:1}
    .uv-orbit svg{animation:orbit-spin 3s linear infinite;width:100%;height:100%}
    @keyframes orbit-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

    /* ── RAIN PULSE ─────────────────────── */
    .rain-ripple{
      position:absolute;bottom:10px;right:14px;
      width:40px;height:40px;pointer-events:none;
    }
    .ripple-ring{
      position:absolute;inset:0;border-radius:50%;
      border:1.5px solid rgba(96,165,250,.5);
      animation:ripple 2s ease-out infinite;
    }
    .ripple-ring:nth-child(2){animation-delay:.6s}
    .ripple-ring:nth-child(3){animation-delay:1.2s}
    @keyframes ripple{
      0%{transform:scale(.4);opacity:1}100%{transform:scale(1.4);opacity:0}
    }

    /* ── SENSOR PULSE ───────────────────── */
    .sensor-ping{
      position:absolute;top:14px;right:14px;width:20px;height:20px;
      display:flex;align-items:center;justify-content:center;
    }
    .ping-core{width:8px;height:8px;border-radius:50%;background:var(--green);animation:ping-core 1.5s ease-in-out infinite}
    .ping-wave{
      position:absolute;inset:0;border-radius:50%;
      background:rgba(74,222,128,.3);animation:ping-wave 1.5s ease-out infinite;
    }
    @keyframes ping-core{0%,100%{opacity:1}50%{opacity:.6}}
    @keyframes ping-wave{0%{transform:scale(.4);opacity:.8}100%{transform:scale(2.2);opacity:0}}

    /* ── CHARTS ─────────────────────────── */
    .charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
    @media(max-width:580px){.charts{grid-template-columns:1fr}}
    .chart-card{
      background:var(--surface);border:1px solid var(--border);border-radius:14px;
      padding:14px 14px 10px;transition:border-color .2s;
    }
    .chart-card:hover{border-color:var(--border2)}
    .chart-label{font-size:.63rem;letter-spacing:.1em;color:var(--text-dim);margin-bottom:10px}

    /* ── TABLE ──────────────────────────── */
    .table-card{
      background:var(--surface);border:1px solid var(--border);border-radius:14px;
      padding:16px;overflow-x:auto;
    }
    .table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
    .table-title{font-size:.63rem;letter-spacing:.1em;color:var(--text-dim)}
    .row-count{font-size:.63rem;color:var(--muted)}
    table{width:100%;border-collapse:collapse;font-size:.71rem;min-width:480px}
    th{text-align:left;padding:6px 10px;color:var(--text-dim);border-bottom:1px solid var(--border);font-weight:400;letter-spacing:.06em;white-space:nowrap}
    td{padding:7px 10px;border-bottom:1px solid rgba(56,189,248,.04);white-space:nowrap;transition:background .15s}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(56,189,248,.04)}
    .badge{display:inline-block;font-size:.6rem;padding:2px 9px;border-radius:20px;letter-spacing:.05em}
    .b-yes{background:rgba(96,165,250,.12);color:var(--rain);border:1px solid rgba(96,165,250,.2)}
    .b-no{background:rgba(71,85,105,.15);color:var(--muted);border:1px solid rgba(71,85,105,.2)}
    .b-ok{background:rgba(74,222,128,.1);color:var(--green);border:1px solid rgba(74,222,128,.2)}
    .b-err{background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.2)}
    .btn-refresh{
      background:transparent;border:1px solid var(--border2);color:var(--accent);
      font-family:var(--font-mono);font-size:.68rem;letter-spacing:.08em;
      padding:6px 14px;border-radius:6px;cursor:pointer;transition:background .15s,box-shadow .15s;
    }
    .btn-refresh:hover{background:rgba(56,189,248,.08);box-shadow:0 0 12px rgba(56,189,248,.15)}
    .spin{display:inline-block;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── FADE IN CARDS ──────────────────── */
    @keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .card{animation:cardIn .4s ease-out both}
    .card:nth-child(1){animation-delay:.05s}.card:nth-child(2){animation-delay:.1s}
    .card:nth-child(3){animation-delay:.15s}.card:nth-child(4){animation-delay:.2s}
    .card:nth-child(5){animation-delay:.25s}.card:nth-child(6){animation-delay:.3s}
  </style>
</head>
<body>
<div class="page-content">
  <div class="header">
    <div class="header-left">
      <h1>WEATHER STATION</h1>
      <p>ESP32 + DHT11 &rarr; SUPABASE</p>
    </div>
    <div class="header-right">
      <div class="live-badge"><span class="live-dot"></span>LIVE</div>
      <span id="last-updated">&mdash;</span>
    </div>
  </div>

  <div class="cards">
    <!-- TEMPERATURE -->
    <div class="card c-temp">
      <div class="card-icon">TEMPERATURE</div>
      <div class="card-value" id="v-temp">--</div>
      <div class="card-unit">CELSIUS</div>
      <div class="heat-glow"></div>
      <div class="flame-container">
        <div class="flame"></div><div class="flame"></div><div class="flame"></div>
        <div class="flame"></div><div class="flame"></div>
      </div>
    </div>

    <!-- HUMIDITY -->
    <div class="card c-hum">
      <div class="card-icon">HUMIDITY</div>
      <div class="card-value" id="v-hum">--</div>
      <div class="card-unit">PERCENT</div>
      <div class="drop-container" id="drop-container"></div>
    </div>

    <!-- UV INDEX -->
    <div class="card c-uv">
      <div class="card-icon">UV INDEX</div>
      <div class="card-value" id="v-uv">--</div>
      <div class="card-unit">SCALE 0-11</div>
      <div class="uv-orbit">
        <svg viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="27" cy="27" r="20" stroke="rgba(129,140,248,.18)" stroke-width="2"/>
          <circle cx="27" cy="27" r="20" stroke="rgba(129,140,248,.55)" stroke-width="2"
            stroke-dasharray="70 56" stroke-linecap="round"/>
          <circle cx="27" cy="7" r="3.5" fill="#818cf8" opacity=".9"/>
          <circle cx="27" cy="27" r="10" stroke="rgba(129,140,248,.12)" stroke-width="1.5"/>
        </svg>
      </div>
    </div>

    <!-- WIND -->
    <div class="card c-wind">
      <div class="card-icon">WIND SPEED</div>
      <div class="card-value" id="v-wind">--</div>
      <div class="card-unit">M / S</div>
      <div class="wind-container" id="wind-container"></div>
    </div>

    <!-- RAIN FORECAST -->
    <div class="card c-rain" id="rain-card">
      <div class="card-icon">RAIN FORECAST</div>
      <div class="card-value" id="v-rain">--</div>
      <div class="card-unit">PREDICTION</div>
      <div class="rain-ripple">
        <div class="ripple-ring"></div>
        <div class="ripple-ring"></div>
        <div class="ripple-ring"></div>
      </div>
    </div>

    <!-- SENSOR -->
    <div class="card c-ok" id="sensor-card">
      <div class="card-icon">SENSOR</div>
      <div class="card-value" id="v-sensor">--</div>
      <div class="card-unit">STATUS</div>
      <div class="sensor-ping">
        <div class="ping-wave"></div>
        <div class="ping-core"></div>
      </div>
    </div>
  </div>

  <div class="charts">
    <div class="chart-card">
      <div class="chart-label">TEMPERATURE HISTORY (&deg;C)</div>
      <div style="position:relative;height:150px">
        <canvas id="tempChart" role="img" aria-label="Temperature history"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-label">HUMIDITY HISTORY (%)</div>
      <div style="position:relative;height:150px">
        <canvas id="humChart" role="img" aria-label="Humidity history"></canvas>
      </div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <span class="table-title">RECENT READINGS</span>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="row-count" id="row-count"></span>
        <button class="btn-refresh" id="btn-refresh" onclick="loadData()">&#8635; REFRESH</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>TIME</th><th>TEMP &deg;C</th><th>HUM %</th>
          <th>UV</th><th>WIND m/s</th><th>RAIN</th><th>SENSOR</th>
        </tr>
      </thead>
      <tbody id="tbl-body">
        <tr><td colspan="7" style="text-align:center;padding:24px;color:#475569">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  /* ── CONFIG ─────────────────────────────────── */
  const SB_URL = 'https://tmxtcxhswgfhchgjzbhr.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRteHRjeGhzd2dmaGNoZ2p6YmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NjM2MzUsImV4cCI6MjA5MTUzOTYzNX0.dfBhrpAaErAuSms39cTtS29ashzKfApQ72QQah6kDT0';

  let tempChart, humChart;

  /* ── UTILS ──────────────────────────────────── */
  function fmt(iso){ return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

  /* ── FAKE DATA FALLBACK ─────────────────────── */
  function fakeRows(){
    const rows=[]; const now=Date.now();
    for(let i=14;i>=0;i--) rows.push({
      created_at:new Date(now-i*30000).toISOString(),
      temperature:+(27+Math.sin(i*.5)*3+Math.random()*.5).toFixed(1),
      humidity:+(62+Math.cos(i*.4)*8+Math.random()).toFixed(1),
      uv_index:+(Math.random()*10).toFixed(1),
      wind_speed:+(Math.random()*12).toFixed(1),
      rain_forecast:Math.random()>.65,
      sensor_ok:true
    });
    return rows;
  }

  /* ── INIT PARTICLE ANIMATIONS ───────────────── */
  function initDrops(){
    const c=document.getElementById('drop-container');
    c.innerHTML='';
    for(let i=0;i<20;i++){
      const d=document.createElement('div');
      d.className='drop';
      const left=Math.random()*100;
      const h=8+Math.random()*18;
      const dur=1+Math.random()*1.4;
      const delay=Math.random()*2.5;
      d.style.cssText=`left:${left}%;height:${h}px;animation-duration:${dur}s;animation-delay:${delay}s;`;
      c.appendChild(d);
    }
  }

  function initWindLines(){
    const c=document.getElementById('wind-container');
    c.innerHTML='';
    for(let i=0;i<10;i++){
      const w=document.createElement('div');
      w.className='wline';
      const top=10+Math.random()*80;
      const wid=20+Math.random()*45;
      const dur=1.2+Math.random()*1.5;
      const delay=Math.random()*2;
      w.style.cssText=`top:${top}%;width:${wid}%;animation-duration:${dur}s;animation-delay:${delay}s;`;
      c.appendChild(w);
    }
  }

  /* ── RENDER CARDS ───────────────────────────── */
  function renderCards(r){
    document.getElementById('v-temp').textContent=r.temperature.toFixed(1);
    document.getElementById('v-hum').textContent=r.humidity.toFixed(1);
    document.getElementById('v-uv').textContent=r.uv_index.toFixed(1);
    document.getElementById('v-wind').textContent=r.wind_speed.toFixed(1);
    document.getElementById('v-rain').textContent=r.rain_forecast?'YES':'NO';
    document.getElementById('rain-card').className=r.rain_forecast?'card c-rain':'card';
    document.getElementById('v-sensor').textContent=r.sensor_ok?'OK':'ERR';
    document.getElementById('sensor-card').className=r.sensor_ok?'card c-ok':'card c-err';
  }

  /* ── RENDER TABLE ───────────────────────────── */
  function renderTable(rows){
    const tbody=document.getElementById('tbl-body');
    tbody.innerHTML='';
    document.getElementById('row-count').textContent=rows.length+' ROWS';
    [...rows].reverse().forEach(r=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td style="color:var(--text-dim)">${fmt(r.created_at)}</td>
        <td style="color:var(--heat);font-weight:700">${r.temperature.toFixed(1)}</td>
        <td style="color:var(--accent)">${r.humidity.toFixed(1)}</td>
        <td style="color:var(--accent2)">${r.uv_index.toFixed(1)}</td>
        <td style="color:var(--green)">${r.wind_speed.toFixed(1)}</td>
        <td><span class="badge ${r.rain_forecast?'b-yes':'b-no'}">${r.rain_forecast?'YES':'NO'}</span></td>
        <td><span class="badge ${r.sensor_ok?'b-ok':'b-err'}">${r.sensor_ok?'OK':'ERR'}</span></td>`;
      tbody.appendChild(tr);
    });
  }

  /* ── RENDER CHARTS ──────────────────────────── */
  function renderCharts(rows){
    const labels=rows.map(r=>fmt(r.created_at));
    const temps=rows.map(r=>+r.temperature.toFixed(1));
    const hums=rows.map(r=>+r.humidity.toFixed(1));
    const base={
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#475569',font:{size:9,family:'Space Mono'},maxRotation:0,maxTicksLimit:6},grid:{color:'rgba(56,189,248,.05)'}},
        y:{ticks:{color:'#475569',font:{size:9,family:'Space Mono'}},grid:{color:'rgba(56,189,248,.05)'}}
      }
    };
    if(tempChart) tempChart.destroy();
    if(humChart)  humChart.destroy();
    tempChart=new Chart(document.getElementById('tempChart'),{
      type:'line',
      data:{labels,datasets:[{data:temps,borderColor:'#fb923c',backgroundColor:'rgba(251,146,60,.07)',tension:.38,pointRadius:2,fill:true,borderWidth:1.8}]},
      options:base
    });
    humChart=new Chart(document.getElementById('humChart'),{
      type:'line',
      data:{labels,datasets:[{data:hums,borderColor:'#38bdf8',backgroundColor:'rgba(56,189,248,.07)',tension:.38,pointRadius:2,fill:true,borderWidth:1.8}]},
      options:base
    });
  }

  /* ── LOAD DATA (original logic, untouched) ──── */
  async function loadData(){
    const btn=document.getElementById('btn-refresh');
    btn.innerHTML='<span class="spin">&#8635;</span> LOADING';
    btn.disabled=true;
    let rows;
    try{
      const res=await fetch(
        `${SB_URL}/rest/v1/sensor_readings?select=*&order=created_at.desc&limit=20`,
        {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}
      );
      const data=await res.json();
      rows=Array.isArray(data)&&data.length>0?[...data].reverse():fakeRows();
    }catch(e){ rows=fakeRows(); }
    renderCards(rows[rows.length-1]);
    renderTable(rows);
    renderCharts(rows);
    document.getElementById('last-updated').textContent='UPDATED '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    btn.innerHTML='&#8635; REFRESH';
    btn.disabled=false;
  }

  /* ── BOOT ───────────────────────────────────── */
  initDrops();
  initWindLines();
  loadData();
  setInterval(loadData,15000);
</script>
</body>
